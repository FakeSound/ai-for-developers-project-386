<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Бронирование встреч: выберите вид встречи и свободное время в календаре."
    />
    <title>AICalls — запись на встречу</title>
    <script>
      // Ставим тему до первой отрисовки, чтобы не мигало светлым.
      (() => {
        const saved = localStorage.getItem("aicalls-theme");
        const dark =
          saved === "dark" ||
          (saved === null &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
