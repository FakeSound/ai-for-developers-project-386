server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Имена файлов Vite хэширует, поэтому кэшировать их безопасно навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API уходит на бэкенд внутри сети compose. URI после порта не указан
    # намеренно: путь /api/v1/... должен доехать до бэкенда без изменений —
    # ровно с тем префиксом, что объявлен в контракте.
    location /api/v1/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA на react-router: маршруты вроде /admin существуют только в браузере,
    # поэтому неизвестный путь отдаём как index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
