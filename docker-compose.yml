# Локальный запуск ровно того же образа, что уезжает в прод: один сервис,
# один порт, порт задаётся переменной PORT.
#
#   docker compose up -d --build   ->  http://localhost:8080

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
    restart: unless-stopped
    # В slim-образе нет curl и wget, поэтому проверяем питоном. Отдельного
    # health-эндпоинта в контракте нет — берём существующий GET /owner.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/owner')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
