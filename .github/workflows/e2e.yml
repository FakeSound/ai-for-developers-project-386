# Сквозные сценарии на Playwright: настоящий бэкенд + собранный фронтенд.
# Список проверяемых сценариев — docs/scenarios.md.

name: e2e

on:
  pull_request:
  push:
    branches: [main]

# Свежий пуш в ветку отменяет предыдущий прогон: смысла в нём уже нет.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Зависимости
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Окружение бэкенда
        # PYTHON переопределяет python3.11 из скрипта: в раннере нужный
        # интерпретатор ставит setup-python и кладёт его как `python`.
        run: npm run api:install
        env:
          PYTHON: python

      - name: Кэш браузеров Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Браузер
        # Системные библиотеки ставятся всегда: они живут вне кэша браузеров.
        run: npx playwright install --with-deps chromium

      - name: Прогон сценариев
        # Конфиг сам собирает фронтенд и поднимает uvicorn с vite preview.
        run: npx playwright test

      - name: Отчёт
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
